<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>ARCANA | Crear cuenta</title>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            <span>☾</span>
            ARCANA
        </a>

        <nav>
            <a href="index.html"> Inicio </a>
            <a href="apartado1.html">Colección</a>
            <a href="apartado2.html">Alquimia</a>
            <a href="apartado3.html">Astral</a>
            <a href="apartado4.html">Nosotros</a>
        </nav>
    </header>

    <main>
        <section class="registro">
            <div class="registro-card">
                <p class="registro-subtitulo">FORMÁ PARTE DE ARCANA</p>
                <h1>Crear una cuenta</h1>
                 <p class="registro-text">
                    Registrate para descubrir novedades, colecciones
                    y curiosidades de ARCANA.
                </p>

                <form action="" method="post">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="fecha-nacimiento">Fecha de nacimiento</label>
                        <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>
                    </div>
                    
                    <button type="submit"> Crear cuenta </button>
                </form>

                <p class="registro-login">¿Ya tenés una cuenta?</p>
                <a href="login.html">Iniciar sesión</a>
            </div>
        </section>
    </main> 
</body>
</html>
