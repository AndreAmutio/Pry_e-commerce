<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>ARCANA | Iniciar sesión</title>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            <span>☾</span>
            ARCANA
        </a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="apartado1.html">Colección</a>
            <a href="apartado2.html">Alquimia</a>
            <a href="apartado3.html">Astral</a>
            <a href="apartado4.html">Nosotros</a>
        </nav>
    </header>

    <main>
        <section class="login">
            <div class="login-card">
                <p class="login-subtitle">BIENVENIDO A ARCANA</p>
                <h1>Iniciar sesión</h1>
                <p class="login-text"> Ingresá a tu cuenta para continuar explorando nuestra colección.</p>

                <form action="" method="post">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                        >
                    </div>

                    <button type="submit"> Iniciar sesión </button>
                </form>

                <p class="login-register">¿No tenés una cuenta? <a href="registro.html">Crear cuenta</a></p>
            </div>
        </section>
    </main>
</body>
</html>
